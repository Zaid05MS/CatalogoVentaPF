<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Emotions GDL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #1a1a1a;
            font-family: 'Poppins', sans-serif;
            margin: 0;
        }
        .section-heading {
            font-family: 'Playfair Display', serif;
            color: #d4af37;
            font-size: 3.5rem;
            margin-bottom: 10px;
        }
        .form-label {
            color: #d4af37;
            font-weight: bold;
            margin-top: 15px;
        }
        .form-control {
            background: transparent !important;
            border: 1px solid #d4af37 !important;
            color: white !important;
            border-radius: 0;
            padding: 15px;
        }
        .form-control::placeholder {
            color: #666;
        }
        .btn-cotizar {
            background-color: #d4af37;
            border: none;
            color: black;
            font-weight: bold;
            padding: 20px;
            letter-spacing: 2px;
            transition: 0.3s;
            margin-top: 30px;
            width: 100%;
        }
        .btn-cotizar:hover {
            background-color: #fff;
            color: black;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-black fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html" style="color: #d4af37; font-family: 'Playfair Display'; font-weight: bold;">EMOTIONS GDL</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#nosotros">Nosotros</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section style="min-height: 100vh; display: flex; align-items: center; padding: 100px 0;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    
                    <div class="text-center mb-5">
                        <h2 class="section-heading text-uppercase">Cotiza tu Evento</h2>
                        <p style="color: #eeeeee; font-size: 1.2rem;">Llevamos la elegancia de nuestra familia a tu celebración.</p>
                    </div>

                    <form id="contactForm">
                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label">Nombre completo</label>
                                <input type="text" class="form-control" placeholder="Ej. Pablo Gamboa" required>
                                
                                <label class="form-label">Correo Electrónico</label>
                                <input type="email" id="email" class="form-control" placeholder="pablog@gmail.com" required>


                                <label class="form-label">WhatsApp / Teléfono</label>
                                <input type="tel" 
                                       class="form-control" 
                                       placeholder="3312345678" 
                                       pattern="\d{10}" 
                                       maxlength="10" 
                                       oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                                       title="El número debe tener exactamente 10 dígitos numéricos" 
                                       required>
                            </div>
                            
                            <div class="col-md-6">
                                <label class="form-label">Detalles de tu evento</label>
                                <textarea class="form-control" style="height: 260px;" placeholder="¿Qué fecha tienes en mente? ¿Qué mobiliario necesitas?" required></textarea>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-cotizar text-uppercase">
                            Enviar Solicitud de Cotización
                        </button>
                    </form>

                </div>
            </div>
        </div>
    </section>

</body>
</html>
